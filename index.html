<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 PawShare — 寵物分享交流平台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #FFB3C6;
  --peach: #FFDBB4;
  --mint: #B5EAD7;
  --lavender: #C9B8F0;
  --yellow: #FFF1A8;
  --bg: #FFF8F0;
  --white: #FFFFFF;
  --card-shadow: 0 4px 20px rgba(255,150,150,0.10);
  --text: #5a3e3e;
  --text-muted: #a0806e;
  --radius: 20px;
  --radius-sm: 12px;
  --nav-h: 68px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
h1,h2,h3,.logo { font-family: 'Nunito', sans-serif; }
.view { display: none; min-height: 100vh; }
.view.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

nav {
  position: sticky; top: 0; z-index: 100;
  height: var(--nav-h);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--pink);
  display: flex; align-items: center;
  padding: 0 24px; gap: 12px;
}
.logo { font-size: 1.5rem; font-weight: 900; color: #ff7aa2; flex: 1; }
.logo span { color: var(--text); font-weight: 400; font-size: 1rem; }
.nav-btn {
  background: none; border: 2px solid transparent;
  padding: 8px 18px; border-radius: 50px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem;
  cursor: pointer; color: var(--text-muted); transition: all 0.2s;
}
.nav-btn:hover, .nav-btn.active { background: var(--pink); color: var(--text); border-color: var(--pink); }
.nav-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); cursor: pointer; }
.nav-name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
.btn {
  display: inline-block; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  border-radius: 50px; transition: transform 0.18s, box-shadow 0.18s;
  text-decoration: none;
}
.btn:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(255,130,130,0.25); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: linear-gradient(135deg,#ffb3c6,#ffcba4); color: #fff; padding: 12px 28px; font-size: 1rem; }
.btn-outline { background: none; border: 2px solid var(--pink); color: #ff7aa2; padding: 10px 22px; font-size: 0.95rem; }
.btn-sm { padding: 7px 16px; font-size: 0.85rem; }

#authView {
  background: linear-gradient(145deg, #ffe8f0 0%, #fff3e0 50%, #e8f8f0 100%);
  align-items: center; justify-content: center;
  padding: 40px 16px;
}
.auth-card {
  background: var(--white); border-radius: var(--radius);
  padding: 40px 36px; max-width: 420px; width: 100%;
  box-shadow: 0 8px 40px rgba(255,150,150,0.18);
  animation: fadeIn 0.4s ease;
}
.auth-logo { text-align: center; font-size: 2.2rem; font-weight: 900; color: #ff7aa2; margin-bottom: 6px; }
.auth-sub { text-align: center; color: var(--text-muted); margin-bottom: 28px; font-size: 0.9rem; }
.tab-row { display: flex; gap: 8px; margin-bottom: 24px; background: #fff0f5; border-radius: 50px; padding: 4px; }
.tab-btn {
  flex: 1; border: none; background: none; padding: 10px;
  border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: 0.95rem; cursor: pointer; color: var(--text-muted); transition: all 0.2s;
}
.tab-btn.active { background: var(--pink); color: var(--white); }
.form-group { margin-bottom: 16px; }
label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
input[type=text], input[type=password], textarea {
  width: 100%; padding: 12px 16px;
  border: 2px solid #ffd5e5; border-radius: var(--radius-sm);
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; color: var(--text);
  background: #fff8fb; outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--pink); background: #fff; }
textarea { resize: vertical; min-height: 100px; }
.avatar-upload-wrap { display: flex; align-items: center; gap: 16px; }
.avatar-preview {
  width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
  border: 3px solid var(--pink); background: #ffe0ec;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; overflow: hidden; flex-shrink: 0;
}
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.file-btn {
  background: #fff0f5; border: 2px dashed var(--pink);
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem;
  cursor: pointer; color: #ff7aa2; transition: background 0.2s;
}
.file-btn:hover { background: #ffe0ec; }
input[type=file] { display: none; }
.err { color: #e84393; font-size: 0.82rem; margin-top: 6px; }
.auth-footer { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--text-muted); }

#homeView { padding-bottom: 60px; }
.home-hero {
  background: linear-gradient(135deg, #ffe0ec, #ffecd2);
  padding: 32px 24px; margin-bottom: 24px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.hero-avatar {
  width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
  border: 4px solid var(--white); box-shadow: 0 4px 16px rgba(255,150,150,0.3);
  flex-shrink: 0;
}
.hero-text h2 { font-size: 1.5rem; font-weight: 900; color: #ff7aa2; }
.hero-text p { color: var(--text-muted); font-size: 0.9rem; }
.container { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.section-title { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
  background: var(--white); border-radius: var(--radius); border: 2px dashed #ffd5e5;
}
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
.clickable-user { cursor: pointer; transition: opacity 0.2s; }
.clickable-user:hover { opacity: 0.8; }

/* CAPTCHA */
.captcha-overlay {
  position: fixed; inset: 0; background: rgba(100,50,80,0.4);
  backdrop-filter: blur(6px); z-index: 1000;
  display: none; align-items: center; justify-content: center;
}
.captcha-box {
  background: white; border-radius: 24px; padding: 32px;
  max-width: 460px; width: 90%;
  box-shadow: 0 12px 50px rgba(255,100,150,0.25);
  animation: popIn 0.3s ease;
}
@keyframes popIn { from { transform: scale(0.85); opacity:0; } to { transform: scale(1); opacity:1; } }
.captcha-title {
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem;
  color: #5a3e3e; margin-bottom: 20px; text-align: center;
}
.captcha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.captcha-img-wrap {
  position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px;
  overflow: hidden; cursor: pointer; border: 3px solid transparent; transition: border 0.2s;
  background: #f5f5f5;
}
.captcha-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.captcha-img-wrap.selected { border-color: #FFB3C6; }
.captcha-badge {
  position: absolute; bottom: 6px; right: 6px;
  width: 24px; height: 24px; background: #FFB3C6; color: white;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: bold; opacity: 0; transform: scale(0.5); transition: all 0.2s;
}
.captcha-img-wrap.selected .captcha-badge { opacity: 1; transform: scale(1); }
.captcha-err {
  color: #e84393; font-size: 0.85rem; text-align: center; margin-bottom: 12px;
  font-weight: 700; min-height: 1.2em;
}
.captcha-err.shake { animation: shake 0.4s; }
@keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-5px)} 100%{transform:translateX(0)} }
.captcha-btns { display: flex; gap: 12px; justify-content: center; }
.captcha-btn-cancel {
  background: #f0f0f0; color: #888; border: none; border-radius: 50px;
  padding: 12px 28px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; flex: 1;
  transition: background 0.2s;
}
.captcha-btn-cancel:hover { background: #e0e0e0; }
.captcha-btn-verify {
  background: linear-gradient(135deg, #ff9a3c, #ff6b35); color: white; border: none;
  border-radius: 50px; padding: 12px 28px; font-weight: 700; cursor: pointer;
  font-family: 'Nunito', sans-serif; box-shadow: 0 4px 12px rgba(255,107,53,0.3); flex: 1;
  transition: transform 0.18s;
}
.captcha-btn-verify:hover { transform: scale(1.04); }

/* POST CARD */
.post-card {
  background: var(--white); border-radius: var(--radius);
  box-shadow: var(--card-shadow); border: 1.5px solid #ffeaea;
  margin-bottom: 18px; overflow: hidden; animation: fadeIn 0.3s ease;
}
.post-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
.post-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); flex-shrink: 0; }
.post-user-info .post-username { font-weight: 700; font-size: 0.95rem; color: var(--text); }
.post-user-info .post-time { font-size: 0.78rem; color: var(--text-muted); }
.post-topic { font-weight: 800; font-size: 1.05rem; padding: 0 18px 8px; color: #d63b7a; font-family:'Nunito',sans-serif; }
.post-content { padding: 0 18px 12px; font-size: 0.93rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
.post-img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
.post-actions { display: flex; border-top: 1.5px solid #fff0f5; }
.action-btn {
  flex: 1; background: none; border: none; padding: 13px 0;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.92rem;
  cursor: pointer; color: var(--text-muted); display: flex;
  align-items: center; justify-content: center; gap: 6px; transition: background 0.18s;
}
.action-btn:hover { background: #fff5f8; }
.action-btn.liked { color: #ff6b9d; }
.action-btn span.action-icon { font-size: 1.15rem; }
.action-btn:first-child { border-right: 1.5px solid #fff0f5; }
.comments-section { background: #fff8fc; border-top: 1.5px solid #fff0f5; }
.comments-inner { padding: 14px 18px; }
.comment-item { display: flex; gap: 10px; margin-bottom: 14px; }
.comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); flex-shrink: 0; margin-top: 2px; }
.comment-bubble { background: var(--white); border-radius: 14px 14px 14px 4px; padding: 8px 14px; border: 1.5px solid #ffd5e5; flex: 1; }
.comment-name { font-weight: 700; font-size: 0.82rem; color: #ff7aa2; margin-bottom: 2px; }
.comment-text { font-size: 0.88rem; color: var(--text); line-height: 1.5; }
.comment-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
.comment-input-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.comment-input-row input { flex: 1; padding: 10px 14px; border-radius: 50px; font-size: 0.88rem; }
.comment-input-row button { border-radius: 50px; padding: 10px 20px; white-space: nowrap; }
.guest-comment-hint { text-align: center; padding: 14px; font-size: 0.88rem; color: var(--text-muted); }
.guest-comment-hint a { color: #ff7aa2; font-weight: 700; cursor: pointer; text-decoration: underline; }

#postView { padding-bottom: 60px; }
.post-header-bar {
  background: var(--white); border-bottom: 2px solid var(--pink);
  padding: 16px 24px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 50;
}
.back-btn {
  background: #fff0f5; border: none; width: 38px; height: 38px;
  border-radius: 50%; font-size: 1.2rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0;
}
.back-btn:hover { background: var(--pink); }
.post-form-card {
  background: var(--white); border-radius: var(--radius);
  box-shadow: var(--card-shadow); padding: 24px;
  margin: 24px auto; max-width: 640px;
}
.poster-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.poster-avatar-lg { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid var(--pink); flex-shrink: 0; }
.poster-row .poster-id { font-weight: 800; color: var(--text); font-size: 1rem; }
.img-preview-wrap { margin-top: 12px; position: relative; display: inline-block; }
.img-preview-wrap img { max-height: 200px; border-radius: var(--radius-sm); border: 2px solid var(--pink); }
.remove-img-btn {
  position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%;
  background: #ff6b9d; color: white; border: none; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

#feedView { padding-bottom: 60px; }
.feed-hero { background: linear-gradient(135deg, #ffe0f5, #ffd5e5, #e8f8ee); padding: 28px 24px; text-align: center; margin-bottom: 8px; }
.feed-hero h2 { font-size: 1.8rem; font-weight: 900; color: #ff7aa2; }
.feed-hero p { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }
.feed-container { max-width: 720px; margin: 0 auto; padding: 0 16px; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(100,50,80,0.35);
  backdrop-filter: blur(4px); z-index: 999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-box {
  background: var(--white); border-radius: var(--radius);
  padding: 36px 32px; max-width: 360px; width: 90%;
  box-shadow: 0 12px 50px rgba(255,100,150,0.25);
  text-align: center; animation: popIn 0.3s ease;
}
.modal-box h3 { font-size: 1.3rem; font-weight: 900; color: #ff7aa2; margin-bottom: 10px; }
.modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px; }
.modal-btns { display: flex; gap: 12px; justify-content: center; }

.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #ff7aa2; color: white; padding: 12px 24px;
  border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: 0.92rem; box-shadow: 0 6px 24px rgba(255,100,150,0.35);
  z-index: 9999; opacity: 0; transition: all 0.35s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .auth-card { padding: 28px 20px; }
  .home-hero { padding: 20px 16px; }
  .container { padding: 0 10px; }
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #ffc8d8; border-radius: 99px; }
</style>
</head>
<body>

<!-- AUTH VIEW -->
<div id="authView" class="view active">
  <div class="auth-card">
    <div class="auth-logo">🐾 PawShare</div>
    <div class="auth-sub">與世界分享你的毛孩故事</div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('login')">登入</button>
      <button class="tab-btn" onclick="switchTab('register')">註冊</button>
    </div>
    <div id="loginForm">
      <div class="form-group">
        <label>帳號 ID</label>
        <input type="text" id="loginId" placeholder="輸入你的 ID">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="loginPwd" placeholder="輸入密碼">
      </div>
      <div id="loginErr" class="err"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doLogin()">登入 🐾</button>
    </div>
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label>帳號 ID（唯一）</label>
        <input type="text" id="regId" placeholder="例：pawlover123">
      </div>
      <div class="form-group">
        <label>暱稱</label>
        <input type="text" id="regName" placeholder="例：貓奴小明">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="regPwd" placeholder="至少 6 個字元">
      </div>
      <div class="form-group">
        <label>頭貼（可選）</label>
        <div class="avatar-upload-wrap">
          <div class="avatar-preview" id="regAvatarPreview">🐾</div>
          <label class="file-btn" for="regAvatarFile">📷 選擇圖片</label>
          <input type="file" id="regAvatarFile" accept="image/*" onchange="previewRegAvatar(event)">
        </div>
      </div>
      <div id="regErr" class="err"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doRegister()">註冊帳號 ✨</button>
    </div>
    <div class="auth-footer">
      <span id="authSwitchText">還沒有帳號？<a href="#" onclick="switchTab('register');return false;" style="color:#ff7aa2;font-weight:700;">立即註冊</a></span>
    </div>
  </div>
</div>

<!-- HOME VIEW -->
<div id="homeView" class="view">
  <nav>
    <div class="logo">🐾 PawShare <span>毛孩日記</span></div>
    <button class="nav-btn active" onclick="showView('homeView')">我的主頁</button>
    <button class="nav-btn" onclick="showView('feedView')">分享區</button>
    <div style="display:flex;align-items:center;gap:10px;margin-left:8px;">
      <img id="homeNavAvatar" class="nav-avatar" src="" alt="頭貼">
      <span class="nav-name" id="homeNavName"></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">登出</button>
    </div>
  </nav>
  <div class="home-hero">
    <img id="homeHeroAvatar" class="hero-avatar" src="" alt="">
    <div class="hero-text">
      <h2 id="homeWelcome">歡迎回來！🐾</h2>
      <p>分享你今天的毛孩故事吧～</p>
    </div>
    <button class="btn btn-primary" style="margin-left:auto;" onclick="showView('postView')">＋ 新增貼文</button>
  </div>
  <div class="container">
    <div class="section-title">📖 我的貼文</div>
    <div id="myPostsFeed"></div>
  </div>
</div>

<!-- POST VIEW -->
<div id="postView" class="view">
  <div class="post-header-bar">
    <button class="back-btn" onclick="showView('homeView')">←</button>
    <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:1.1rem;color:#ff7aa2;">✏️ 發布新貼文</span>
  </div>
  <div class="container">
    <div class="post-form-card">
      <div class="poster-row">
        <img id="posterAvatar" class="poster-avatar-lg" src="" alt="">
        <div>
          <div class="poster-id" id="posterUsername"></div>
          <div style="font-size:0.8rem;color:var(--text-muted);">正在發布新貼文...</div>
        </div>
      </div>
      <div class="form-group">
        <label>發布主題 *</label>
        <input type="text" id="postTopic" placeholder="例：我家的貓又做壞事了！🐱">
      </div>
      <div class="form-group">
        <label>內容 *</label>
        <textarea id="postContent" placeholder="分享你的毛孩日常吧！" style="min-height:130px;"></textarea>
      </div>
      <div class="form-group">
        <label>附上照片（可選）</label>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <label class="file-btn" for="postImgFile">🖼️ 選擇圖片</label>
          <input type="file" id="postImgFile" accept="image/*" onchange="previewPostImg(event)">
          <span style="font-size:0.8rem;color:var(--text-muted);" id="postImgName">未選擇圖片</span>
        </div>
        <div id="postImgPreviewWrap" style="display:none;margin-top:12px;" class="img-preview-wrap">
          <img id="postImgPreview" src="" alt="預覽">
          <button class="remove-img-btn" onclick="removePostImg()">×</button>
        </div>
      </div>
      <div id="postErr" class="err" style="margin-bottom:12px;"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="doPost()">發布貼文 🐾</button>
    </div>
  </div>
</div>

<!-- FEED VIEW -->
<div id="feedView" class="view">
  <nav>
    <div class="logo">🐾 PawShare <span>毛孩日記</span></div>
    <button class="nav-btn" onclick="showView('homeView')" id="feedHomeBtn">我的主頁</button>
    <button class="nav-btn active" onclick="showView('feedView')">分享區</button>
    <div id="feedNavRight" style="display:flex;align-items:center;gap:10px;margin-left:8px;"></div>
  </nav>
  <div class="feed-hero">
    <h2>🐾 大家的寵物日記</h2>
    <p>所有毛孩家長的日常分享</p>
  </div>
  <div class="feed-container" id="allPostsFeed"></div>
</div>

<!-- PROFILE VIEW -->
<div id="profileView" class="view">
  <div class="post-header-bar">
    <button class="back-btn" onclick="showView('feedView')">←</button>
    <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:1.1rem;color:#ff7aa2;">🐾 個人頁面</span>
  </div>
  <div class="home-hero" style="justify-content:center;text-align:center;flex-direction:column;">
    <img id="profileAvatar" class="hero-avatar" src="" alt="" style="width:100px;height:100px;">
    <div class="hero-text">
      <h2 id="profileName" style="font-size:1.8rem;"></h2>
      <p id="profileId" style="font-size:1rem;color:#ff7aa2;"></p>
    </div>
  </div>
  <div class="container">
    <div class="section-title">📖 他/她的貼文</div>
    <div id="profilePostsFeed"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal-box">
    <h3>🐾 是否已有平台帳號？</h3>
    <p>登入後才能按讚和留言，快來加入毛孩大家庭吧！</p>
    <div class="modal-btns">
      <button class="btn btn-primary btn-sm" onclick="goAuth('login')">登入</button>
      <button class="btn btn-outline btn-sm" onclick="goAuth('register')">註冊</button>
    </div>
  </div>
</div>

<!-- CAPTCHA -->
<div id="captchaOverlay" class="captcha-overlay">
  <div class="captcha-box">
    <div class="captcha-title" id="captchaTitle"></div>
    <div class="captcha-grid" id="captchaGrid"></div>
    <div class="captcha-err" id="captchaErr"></div>
    <div class="captcha-btns">
      <button class="captcha-btn-cancel" onclick="cancelCaptcha()">取消</button>
      <button class="captcha-btn-verify" onclick="verifyCaptcha()">驗證</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
// ===== DATA =====
function getUsers() { return JSON.parse(localStorage.getItem('ps_users') || '[]'); }
function saveUsers(u) { localStorage.setItem('ps_users', JSON.stringify(u)); }
function getPosts() { return JSON.parse(localStorage.getItem('ps_posts') || '[]'); }
function savePosts(p) { localStorage.setItem('ps_posts', JSON.stringify(p)); }
function getCurrentUser() {
  const id = localStorage.getItem('ps_currentUser');
  if (!id) return null;
  return getUsers().find(u => u.id === id) || null;
}
function setCurrentUser(id) { localStorage.setItem('ps_currentUser', id || ''); }
function clearCurrentUser() { localStorage.removeItem('ps_currentUser'); }

const DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="#ffd5e5"/><circle cx="40" cy="38" r="14" fill="#ff7aa2" opacity="0.7"/><circle cx="24" cy="26" r="8" fill="#ff7aa2" opacity="0.7"/><circle cx="56" cy="26" r="8" fill="#ff7aa2" opacity="0.7"/><circle cx="17" cy="42" r="6" fill="#ff7aa2" opacity="0.6"/><circle cx="63" cy="42" r="6" fill="#ff7aa2" opacity="0.6"/></svg>');

// ===== CAPTCHA IMAGES (hardcoded, guaranteed correct animals) =====
// cat: cataas.com — 免費貓咪圖庫，不需 API key
// dog: placedog.net — 免費狗狗圖庫，不需 API key
// other: placekitten.com — 用小貓當干擾項（題目是狗時）/ placedog 當干擾（題目是貓時）
const CAPTCHA_IMGS = {
  cat: [
    'https://cataas.com/cat?width=150&height=150&t=1',
    'https://cataas.com/cat?width=150&height=150&t=2',
    'https://cataas.com/cat?width=150&height=150&t=3',
    'https://cataas.com/cat?width=150&height=150&t=4',
    'https://cataas.com/cat?width=150&height=150&t=5',
    'https://cataas.com/cat?width=150&height=150&t=6',
    'https://cataas.com/cat?width=150&height=150&t=7',
  ],
  dog: [
    'https://placedog.net/150/150?id=10',
    'https://placedog.net/150/150?id=20',
    'https://placedog.net/150/150?id=30',
    'https://placedog.net/150/150?id=40',
    'https://placedog.net/150/150?id=50',
    'https://placedog.net/150/150?id=60',
    'https://placedog.net/150/150?id=70',
  ],
  other: [
    'https://placedog.net/150/150?id=80',
    'https://placedog.net/150/150?id=90',
    'https://cataas.com/cat?width=150&height=150&t=8',
    'https://cataas.com/cat?width=150&height=150&t=9',
    'https://placedog.net/150/150?id=15',
  ]
};

// ===== VIEWS =====
function showView(viewId) {
  ['authView','homeView','postView','feedView','profileView'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; el.classList.remove('active'); }
  });
  const target = document.getElementById(viewId);
  if (!target) return;
  target.style.display = viewId === 'authView' ? 'flex' : 'block';
  void target.offsetWidth;
  target.classList.add('active');
  if (viewId === 'homeView') renderHome();
  if (viewId === 'feedView') renderFeed();
  if (viewId === 'postView') renderPostForm();
  window.scrollTo(0, 0);
}

function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || '#ff7aa2';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== AUTH =====
let regAvatarBase64 = null;
let pendingLoginUser = null;
let captchaAnswers = [];
let captchaSelected = new Set();
let currentCaptchaAnimal = '';

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', isLogin ? i===0 : i===1));
  document.getElementById('authSwitchText').innerHTML = isLogin
    ? '還沒有帳號？<a href="#" onclick="switchTab(\'register\');return false;" style="color:#ff7aa2;font-weight:700;">立即註冊</a>'
    : '已有帳號？<a href="#" onclick="switchTab(\'login\');return false;" style="color:#ff7aa2;font-weight:700;">前往登入</a>';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('regErr').textContent = '';
}

function previewRegAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    regAvatarBase64 = ev.target.result;
    document.getElementById('regAvatarPreview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
  };
  reader.readAsDataURL(file);
}

function doRegister() {
  const id = document.getElementById('regId').value.trim();
  const name = document.getElementById('regName').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const err = document.getElementById('regErr');
  err.textContent = '';
  if (!id) { err.textContent = '請填寫帳號 ID'; return; }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(id)) { err.textContent = 'ID 只能含英數字及底線，3~20 字元'; return; }
  if (!name) { err.textContent = '請填寫暱稱'; return; }
  if (pwd.length < 6) { err.textContent = '密碼至少 6 個字元'; return; }
  const users = getUsers();
  if (users.find(u => u.id === id)) { err.textContent = '此 ID 已被使用，請換一個'; return; }
  users.push({ id, username: name, password: pwd, avatar: regAvatarBase64 || DEFAULT_AVATAR });
  saveUsers(users);
  showToast('🎉 註冊成功！請登入', '#b5ead7');
  document.getElementById('regId').value = '';
  document.getElementById('regName').value = '';
  document.getElementById('regPwd').value = '';
  regAvatarBase64 = null;
  document.getElementById('regAvatarPreview').innerHTML = '🐾';
  setTimeout(() => switchTab('login'), 800);
}

function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  const user = getUsers().find(u => u.id === id && u.password === pwd);
  if (!user) { err.textContent = '帳號或密碼錯誤，請再試一次'; return; }
  pendingLoginUser = user;
  generateCaptcha();
  document.getElementById('captchaOverlay').style.display = 'flex';
}

// ===== CAPTCHA =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCaptcha() {
  const targets = ['cat', 'dog'];
  const titles = { cat: '請選取所有包含貓咪的圖片 🐱', dog: '請選取所有包含狗狗的圖片 🐶' };

  currentCaptchaAnimal = targets[Math.floor(Math.random() * targets.length)];
  document.getElementById('captchaTitle').textContent = titles[currentCaptchaAnimal];
  document.getElementById('captchaErr').textContent = '';
  document.getElementById('captchaErr').classList.remove('shake');

  const correctCount = Math.floor(Math.random() * 3) + 3;
  const otherCount = 9 - correctCount;
  const otherAnimal = currentCaptchaAnimal === 'cat' ? 'dog' : 'cat';
  const correctPool = shuffle(CAPTCHA_IMGS[currentCaptchaAnimal]).slice(0, correctCount)
    .map(url => ({ url, isCorrect: true }));
  const otherPool = shuffle(CAPTCHA_IMGS[otherAnimal]).slice(0, otherCount)
    .map(url => ({ url, isCorrect: false }));
  const pool = shuffle([...correctPool, ...otherPool]);

  captchaAnswers = [];
  captchaSelected.clear();

  const grid = document.getElementById('captchaGrid');
  grid.innerHTML = '';

  pool.forEach((item, idx) => {
    if (item.isCorrect) captchaAnswers.push(idx);
    const wrap = document.createElement('div');
    wrap.className = 'captcha-img-wrap';
    wrap.onclick = () => toggleCaptchaImg(wrap, idx);
    const img = document.createElement('img');
    img.src = item.url;
    img.alt = '';
    img.loading = 'lazy';
    const badge = document.createElement('div');
    badge.className = 'captcha-badge';
    badge.textContent = '✓';
    wrap.appendChild(img);
    wrap.appendChild(badge);
    grid.appendChild(wrap);
  });
}

function toggleCaptchaImg(el, idx) {
  if (captchaSelected.has(idx)) {
    captchaSelected.delete(idx);
    el.classList.remove('selected');
  } else {
    captchaSelected.add(idx);
    el.classList.add('selected');
  }
}

function verifyCaptcha() {
  const err = document.getElementById('captchaErr');
  err.classList.remove('shake');

  const isCorrect = captchaSelected.size === captchaAnswers.length &&
    captchaAnswers.every(a => captchaSelected.has(a));

  if (isCorrect) {
    document.getElementById('captchaOverlay').style.display = 'none';
    setCurrentUser(pendingLoginUser.id);
    showToast('🐾 歡迎回來，' + pendingLoginUser.username + '！');
    document.getElementById('loginId').value = '';
    document.getElementById('loginPwd').value = '';
    pendingLoginUser = null;
    renderHome();
    showView('homeView');
  } else {
    err.textContent = '選取錯誤，請重新驗證';
    void err.offsetWidth;
    err.classList.add('shake');
    setTimeout(() => generateCaptcha(), 900);
  }
}

function cancelCaptcha() {
  document.getElementById('captchaOverlay').style.display = 'none';
  pendingLoginUser = null;
}

function doLogout() {
  clearCurrentUser();
  showToast('👋 已登出', '#c9b8f0');
  setTimeout(() => showView('authView'), 600);
}

function goAuth(tab) {
  closeModalDirect();
  switchTab(tab);
  showView('authView');
}

// ===== MODAL =====
function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
function closeModalDirect() { document.getElementById('modalOverlay').style.display = 'none'; }
function closeModal(e) { if (e.target.id === 'modalOverlay') closeModalDirect(); }

// ===== HOME =====
function renderHome() {
  const user = getCurrentUser();
  if (!user) { showView('authView'); return; }
  const av = user.avatar || DEFAULT_AVATAR;
  document.getElementById('homeNavAvatar').src = av;
  document.getElementById('homeNavName').textContent = user.username;
  document.getElementById('homeHeroAvatar').src = av;
  document.getElementById('homeWelcome').textContent = '歡迎回來，' + user.username + '！🐾';
  const posts = getPosts().filter(p => p.userId === user.id).sort((a,b) => b.timestamp - a.timestamp);
  const feed = document.getElementById('myPostsFeed');
  if (posts.length === 0) {
    feed.innerHTML = '<div class="empty-state"><div class="emoji">🐾</div><div>還沒有貼文，快來分享你的毛孩吧！</div><br><button class="btn btn-primary btn-sm" onclick="showView(\'postView\')" style="margin-top:12px;">＋ 新增貼文</button></div>';
  } else {
    feed.innerHTML = posts.map(p => renderPostCard(p, user)).join('');
    bindPostCardEvents(feed);
  }
}

// ===== POST FORM =====
let postImgBase64 = null;

function renderPostForm() {
  const user = getCurrentUser();
  if (!user) { showView('authView'); return; }
  document.getElementById('posterAvatar').src = user.avatar || DEFAULT_AVATAR;
  document.getElementById('posterUsername').textContent = user.username + ' (' + user.id + ')';
  document.getElementById('postTopic').value = '';
  document.getElementById('postContent').value = '';
  document.getElementById('postErr').textContent = '';
  postImgBase64 = null;
  document.getElementById('postImgPreviewWrap').style.display = 'none';
  document.getElementById('postImgName').textContent = '未選擇圖片';
  document.getElementById('postImgFile').value = '';
}

function previewPostImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('postImgName').textContent = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    postImgBase64 = ev.target.result;
    document.getElementById('postImgPreview').src = ev.target.result;
    document.getElementById('postImgPreviewWrap').style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
}

function removePostImg() {
  postImgBase64 = null;
  document.getElementById('postImgPreviewWrap').style.display = 'none';
  document.getElementById('postImgName').textContent = '未選擇圖片';
  document.getElementById('postImgFile').value = '';
}

function doPost() {
  const user = getCurrentUser();
  const topic = document.getElementById('postTopic').value.trim();
  const content = document.getElementById('postContent').value.trim();
  const err = document.getElementById('postErr');
  err.textContent = '';
  if (!topic) { err.textContent = '請填寫發布主題'; return; }
  if (!content) { err.textContent = '請填寫發布內容'; return; }
  const posts = getPosts();
  posts.unshift({
    postId: 'p' + Date.now(),
    userId: user.id, username: user.username,
    avatar: user.avatar || DEFAULT_AVATAR,
    topic, content, image: postImgBase64 || null,
    timestamp: Date.now(), likes: [], comments: []
  });
  savePosts(posts);
  showToast('🎉 貼文發布成功！');
  showView('homeView');
}

// ===== FEED =====
function renderFeed() {
  const user = getCurrentUser();
  const navRight = document.getElementById('feedNavRight');
  const homeBtn = document.getElementById('feedHomeBtn');
  if (user) {
    navRight.innerHTML = '<img class="nav-avatar" src="' + (user.avatar || DEFAULT_AVATAR) + '" alt=""> <span class="nav-name">' + user.username + '</span> <button class="btn btn-outline btn-sm" onclick="doLogout()">登出</button>';
    homeBtn.style.display = '';
  } else {
    navRight.innerHTML = '<button class="btn btn-primary btn-sm" onclick="showView(\'authView\')">登入 / 註冊</button>';
    homeBtn.style.display = 'none';
  }
  const posts = getPosts().sort((a,b) => b.timestamp - a.timestamp);
  const feed = document.getElementById('allPostsFeed');
  if (posts.length === 0) {
    feed.innerHTML = '<div class="empty-state" style="margin:20px 0;"><div class="emoji">🐾</div><div>還沒有任何貼文，快來第一個分享吧！</div></div>';
  } else {
    feed.innerHTML = posts.map(p => renderPostCard(p, user)).join('');
    bindPostCardEvents(feed);
  }
}

// ===== POST CARD =====
function fmtTime(ts) {
  const d = new Date(ts), pad = n => String(n).padStart(2,'0');
  return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function renderPostCard(post, currentUser) {
  const liked = currentUser && post.likes.includes(currentUser.id);
  const imgHtml = post.image ? '<img class="post-img" src="' + post.image + '" alt="">' : '';
  return `<div class="post-card" data-postid="${post.postId}">
    <div class="post-header">
      <img class="post-avatar clickable-user" src="${post.avatar}" alt="" onclick="viewProfile('${post.userId}')">
      <div class="post-user-info">
        <div class="post-username clickable-user" onclick="viewProfile('${post.userId}')">@${post.userId} · ${post.username}</div>
        <div class="post-time">${fmtTime(post.timestamp)}</div>
      </div>
    </div>
    <div class="post-topic">${escHtml(post.topic)}</div>
    <div class="post-content">${escHtml(post.content)}</div>
    ${imgHtml}
    <div class="post-actions">
      <button class="${liked ? 'action-btn liked' : 'action-btn'} like-btn" data-postid="${post.postId}">
        <span class="action-icon">${liked ? '❤️' : '🤍'}</span> 按讚 ${post.likes.length > 0 ? post.likes.length : ''}
      </button>
      <button class="action-btn comment-toggle-btn" data-postid="${post.postId}">
        <span class="action-icon">💬</span> 留言 ${post.comments.length > 0 ? post.comments.length : ''}
      </button>
    </div>
    <div class="comments-section" id="cmt-${post.postId}" style="display:none;">
      ${renderComments(post, currentUser)}
    </div>
  </div>`;
}

function renderComments(post, currentUser) {
  const cmtList = post.comments.length > 0 ? post.comments.map(c => `
    <div class="comment-item">
      <img class="comment-avatar clickable-user" src="${c.avatar}" alt="" onclick="viewProfile('${c.userId}')">
      <div class="comment-bubble">
        <div class="comment-name clickable-user" onclick="viewProfile('${c.userId}')">@${c.userId} · ${c.username}</div>
        <div class="comment-text">${escHtml(c.text)}</div>
        <div class="comment-time">${fmtTime(c.timestamp)}</div>
      </div>
    </div>`).join('')
    : '<div style="text-align:center;color:var(--text-muted);font-size:0.85rem;padding:8px 0 12px;">還沒有留言，快來第一個留言吧！🐾</div>';

  const inputArea = currentUser
    ? `<div class="comment-input-row">
        <input type="text" placeholder="寫下你的留言..." id="cmtInput-${post.postId}" maxlength="200" onkeydown="if(event.key==='Enter')submitComment('${post.postId}')">
        <button class="btn btn-primary btn-sm" onclick="submitComment('${post.postId}')">送出</button>
       </div>`
    : `<div class="guest-comment-hint">✨ 想留言嗎？<a onclick="openModal()">登入 / 註冊</a> 後即可參與！</div>`;

  return `<div class="comments-inner">${cmtList}${inputArea}</div>`;
}

function submitComment(postId) {
  const user = getCurrentUser();
  if (!user) { openModal(); return; }
  const input = document.getElementById('cmtInput-' + postId);
  const text = input ? input.value.trim() : '';
  if (!text) return;
  const posts = getPosts();
  const post = posts.find(p => p.postId === postId);
  if (!post) return;
  post.comments.push({ commentId: 'c'+Date.now(), userId: user.id, username: user.username, avatar: user.avatar||DEFAULT_AVATAR, text, timestamp: Date.now() });
  savePosts(posts);
  showToast('💬 留言成功！');
  refreshPostCard(postId);
}

function toggleLike(postId) {
  const user = getCurrentUser();
  if (!user) { openModal(); return; }
  const posts = getPosts();
  const post = posts.find(p => p.postId === postId);
  if (!post) return;
  const idx = post.likes.indexOf(user.id);
  if (idx >= 0) post.likes.splice(idx, 1); else post.likes.push(user.id);
  savePosts(posts);
  refreshPostCard(postId);
}

function refreshPostCard(postId) {
  const user = getCurrentUser();
  const post = getPosts().find(p => p.postId === postId);
  if (!post) return;
  const el = document.querySelector('[data-postid="' + postId + '"]');
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderPostCard(post, user);
  const newEl = tmp.firstElementChild;
  el.replaceWith(newEl);
  const cmtSec = newEl.querySelector('.comments-section');
  if (cmtSec) cmtSec.style.display = 'block';
  bindPostCardEvents(newEl.parentElement || newEl);
}

function bindPostCardEvents(container) {
  container.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', function() { toggleLike(this.dataset.postid); });
  });
  container.querySelectorAll('.comment-toggle-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const user = getCurrentUser();
      const cmt = document.getElementById('cmt-' + this.dataset.postid);
      if (!cmt) return;
      if (cmt.style.display === 'none') {
        if (!user) { openModal(); return; }
        cmt.style.display = '';
      } else {
        cmt.style.display = 'none';
      }
    });
  });
}

function viewProfile(userId) {
  const user = getUsers().find(u => u.id === userId);
  if (!user) { showToast('找不到此使用者'); return; }
  document.getElementById('profileAvatar').src = user.avatar || DEFAULT_AVATAR;
  document.getElementById('profileName').textContent = user.username;
  document.getElementById('profileId').textContent = '@' + user.id;
  renderProfile(userId);
  showView('profileView');
}

function renderProfile(userId) {
  const currentUser = getCurrentUser();
  const posts = getPosts().filter(p => p.userId === userId).sort((a,b) => b.timestamp - a.timestamp);
  const feed = document.getElementById('profilePostsFeed');
  if (posts.length === 0) {
    feed.innerHTML = '<div class="empty-state" style="margin-top:20px;"><div class="emoji">🐾</div><div>這個人還沒有發布過貼文呢！</div></div>';
  } else {
    feed.innerHTML = posts.map(p => renderPostCard(p, currentUser)).join('');
    bindPostCardEvents(feed);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== INIT =====
(function init() {
  const user = getCurrentUser();
  if (user) { renderHome(); showView('homeView'); }
  else { showView('authView'); }
})();
</script>
